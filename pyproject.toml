[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalops"
version = "0.0.1"
description = "Agent 评测、回归对比与 CI 门禁平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
evalops = "evalops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalops"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/evalops/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/evalops"]
ignore_missing_imports = true
warn_unused_ignores = false
